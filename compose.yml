
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c log_statement=all
      -c log_duration=on
      -c log_min_duration_statement=0
      -c logging_collector=off
      -c client_min_messages=log
      -c log_error_verbosity=default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
    env_file:
      - .env
    command: python -m services.backend
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      fill_db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://backend:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    profiles:
      - with_backend
    restart: unless-stopped

  bot:
    build:
      context: .
    env_file:
      - .env
    command: python -m services.bot
    depends_on:
      fill_db:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    profiles:
      - with_bot
    restart: unless-stopped

  fill_db:
    build:
      context: .
    env_file:
      - .env
    depends_on:
      alembic:
        condition: service_completed_successfully
    command: python -m services.fill_db

  alembic:
    build:
      context: .
    command: alembic -c services/alembic/alembic.ini upgrade head
    restart: no
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./services/frontend
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - with_frontend
    restart: unless-stopped

  nginx:
    image: nginx:latest
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./services/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./logs/nginx:/var/log/nginx/
    profiles:
     - with_backend
    restart: unless-stopped
    ports:
      - ${NGINX_PORT}:80

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
